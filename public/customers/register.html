<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Casa Decor</title>
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="auth-page register-page">
    <a class="menu-link" href="/customers/index.html" aria-label="Về trang chủ"><i class="fa-solid fa-bars"></i></a>
    <main class="auth-shell register-shell">
        <a class="auth-brand compact" href="/customers/index.html" aria-label="Về trang chủ Casa Decor">
            <span class="auth-logo-mark"><i class="fa-solid fa-house-chimney-window"></i></span>
            <div>
                <h1>Casa Decor</h1>
                <p>DECOR FOR YOUR HOME</p>
            </div>
        </a>

        <h2>Đăng ký</h2>
        <form id="registerForm" class="auth-form">
            <label>Họ và tên</label>
            <div class="field">
                <i class="fa-regular fa-user"></i>
                <input name="name" type="text" placeholder="Nhập họ và tên" required>
            </div>

            <label>Email</label>
            <div class="field">
                <i class="fa-regular fa-envelope"></i>
                <input name="email" type="email" placeholder="Nhập email của bạn" required>
            </div>

            <label>Số điện thoại</label>
            <div class="field">
                <i class="fa-solid fa-phone"></i>
                <input name="phone" type="tel" placeholder="Nhập số điện thoại" required>
            </div>

            <label>Mật khẩu</label>
            <div class="field">
                <i class="fa-solid fa-lock"></i>
                <input name="password" type="password" placeholder="Nhập mật khẩu" minlength="6" required>
                <button class="toggle-pass" type="button" aria-label="Hiện mật khẩu"><i class="fa-regular fa-eye"></i></button>
            </div>

            <p id="authMessage" class="auth-message"></p>
            <button class="auth-submit" type="submit">Đăng ký</button>
        </form>

        <div class="auth-footer"><a class="under" href="/customers/login.html">Đăng nhập</a></div>
    </main>
    <script src="/js/auth.js"></script>

    <!-- Zalo floating button -->
    <a href="https://zalo.me/0336881795" id="zaloFloatBtn" class="zalo-float" target="_blank" rel="noopener" aria-label="Liên hệ Zalo">
        <span class="zalo-float-label">Nhắn tin Zalo</span>
        <span class="zalo-float-core">Zalo</span>
    </a>
</body>

</html>
