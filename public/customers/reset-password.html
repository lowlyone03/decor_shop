<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dat lai mat khau - Casa Decor</title>
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="auth-page login-page">
    <a class="menu-link" href="/customers/index.html" aria-label="Ve trang chu"><i class="fa-solid fa-bars"></i></a>
    <main class="auth-shell">
        <a class="auth-brand" href="/customers/index.html" aria-label="Casa Decor">
            <span class="auth-logo-mark"><i class="fa-solid fa-house-chimney-window"></i></span>
            <div><h1>Casa Decor</h1><p>DECOR FOR YOUR HOME</p></div>
        </a>
        <h2>Dat lai mat khau</h2>
        <p class="auth-sub">Tao mat khau moi cho tai khoan cua ban.</p>
        <form id="resetForm" class="auth-form">
            <input name="email" type="hidden">
            <input name="token" type="hidden">
            <label>Mat khau moi</label>
            <div class="field">
                <i class="fa-solid fa-lock"></i>
                <input name="password" type="password" minlength="6" required>
                <button class="toggle-pass" type="button" aria-label="Hien mat khau"><i class="fa-regular fa-eye"></i></button>
            </div>
            <label>Nhap lai mat khau</label>
            <div class="field">
                <i class="fa-solid fa-lock"></i>
                <input name="confirmPassword" type="password" minlength="6" required>
            </div>
            <p id="authMessage" class="auth-message"></p>
            <button class="auth-submit" type="submit"><i class="fa-solid fa-lock"></i> Dat lai mat khau</button>
        </form>
        <div class="auth-footer"><a href="/customers/login.html">Dang nhap <i class="fa-solid fa-arrow-right"></i></a></div>
    </main>
    <script src="/js/auth.js"></script>

    <!-- Zalo floating button -->
    <a href="https://zalo.me/0336881795" id="zaloFloatBtn" class="zalo-float" target="_blank" rel="noopener" aria-label="Liên hệ Zalo">
        <span class="zalo-float-label">Nhắn tin Zalo</span>
        <span class="zalo-float-core">Zalo</span>
    </a>
</body>

</html>
