<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quen mat khau - Casa Decor</title>
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="auth-page login-page">
    <a class="menu-link" href="/customers/index.html" aria-label="Ve trang chu"><i class="fa-solid fa-bars"></i></a>
    <main class="auth-shell">
        <a class="auth-brand" href="/customers/index.html" aria-label="Casa Decor">
            <span class="auth-logo-mark"><i class="fa-solid fa-house-chimney-window"></i></span>
            <div><h1>Casa Decor</h1><p>DECOR FOR YOUR HOME</p></div>
        </a>
        <h2>Quen mat khau</h2>
        <p class="auth-sub">Nhap email de tao lien ket dat lai mat khau.</p>
        <form id="forgotForm" class="auth-form">
            <label>Email</label>
            <div class="field">
                <i class="fa-regular fa-envelope"></i>
                <input name="email" type="email" placeholder="email@example.com" required>
            </div>
            <p id="authMessage" class="auth-message"></p>
            <button class="auth-submit" type="submit"><i class="fa-regular fa-paper-plane"></i> Gui lien ket</button>
        </form>
        <div class="auth-footer"><a href="/customers/login.html">Quay lai dang nhap <i class="fa-solid fa-arrow-right"></i></a></div>
    </main>
    <script src="/js/auth.js"></script>

    <!-- Zalo floating button -->
    <a href="https://zalo.me/0336881795" id="zaloFloatBtn" class="zalo-float" target="_blank" rel="noopener" aria-label="Liên hệ Zalo">
        <span class="zalo-float-label">Nhắn tin Zalo</span>
        <span class="zalo-float-core">Zalo</span>
    </a>
</body>

</html>
